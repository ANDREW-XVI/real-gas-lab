<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real-gas lab: cubic equations of state for PVT, H, S and fugacity</title>
<meta name="description" content="Free calculator for real-gas behaviour: compressibility, fugacity, residual and total enthalpy and entropy, vapour pressure, with van der Waals, Redlich-Kwong, Soave-Redlich-Kwong and Peng-Robinson equations.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%233fd0b4%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-family=%27Arial%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%2305211c%27%3E%CF%86%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">φ</span><span class="bname">Real-gas lab</span><span class="bsub" id="bsub"></span></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-tab="diagram">Phase diagram</button>
    <button role="tab" data-tab="properties">Properties</button>
    <button role="tab" data-tab="compare">Compare equations</button>
    <button role="tab" data-tab="theory">Theory</button>
  </nav>
  <div class="topr"><button class="ghost" id="share" type="button">Copy link</button></div>
</header>

<main class="grid">
  <section class="col controls" aria-label="Inputs">
    <label for="gas">Gas</label>
    <select id="gas"></select>
    <div id="custom" class="custom" hidden>
      <div class="two"><div><label for="cTc">Tc (K)</label><input id="cTc" inputmode="decimal" value="190.6"></div>
      <div><label for="cPc">Pc (bar)</label><input id="cPc" inputmode="decimal" value="45.99"></div></div>
      <div class="two"><div><label for="cW">ω</label><input id="cW" inputmode="decimal" value="0.012"></div>
      <div><label for="cCp">Cp/R: A B C D</label><input id="cCp" value="3.5 0 0 0"></div></div>
    </div>

    <label>Equation of state</label>
    <div class="eos" id="eosBtns" role="group" aria-label="Equation of state">
      <button type="button" data-eos="VDW">van der Waals</button>
      <button type="button" data-eos="RK">Redlich-Kwong</button>
      <button type="button" data-eos="SRK">Soave-Redlich-Kwong</button>
      <button type="button" data-eos="PR">Peng-Robinson</button>
    </div>

    <div class="sl">
      <div class="t"><label for="T">Temperature</label><span class="val"><input id="T" inputmode="decimal" aria-describedby="uT"><small id="uT">K</small></span></div>
      <input type="range" id="Tr" min="0" max="1000" step="1" aria-label="Temperature slider">
    </div>
    <div class="sl">
      <div class="t"><label for="P">Pressure</label><span class="val"><input id="P" inputmode="decimal" aria-describedby="uP"><small id="uP">bar</small></span></div>
      <input type="range" id="Pr" min="0" max="1000" step="1" aria-label="Pressure slider">
    </div>
    <p class="hint">Type a value with units if you like: <code>25C</code>, <code>80F</code>, <code>5MPa</code>, <code>1atm</code>, <code>700psi</code>.</p>
    <p class="err" id="err" role="alert" hidden></p>
  </section>

  <section class="stage" id="stage" aria-live="polite"></section>

  <aside class="col readout" id="readout" aria-label="Results"></aside>
</main>

<script src="vendor/katex/katex.min.js"></script>
<script src="js/gases.js"></script>
<script src="js/eos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
